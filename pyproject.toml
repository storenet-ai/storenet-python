[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "storenet"
version = "0.1.0"
description = "CLI và thư viện Python cho StoreNet Partner API: tạo, sửa bằng AI và liệt kê mẫu thiết kế web."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Author email PLACEHOLDER stays out until chosen: hatchling rejects a value that is not an address.
authors = [{ name = "PLACEHOLDER" }]
keywords = ["storenet", "partner-api", "cli", "shop-design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
storenet = "storenet.cli:main"

[project.urls]
Homepage = "https://storenet.ai"
Source = "https://github.com/storenet-ai/storenet-python"

[tool.hatch.build.targets.wheel]
packages = ["src/storenet"]

[tool.hatch.build.targets.sdist]
include = ["src/storenet", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
